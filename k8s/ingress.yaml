apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-bye-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: __COUNTRY__.local
      http:
        paths:
          - path: /hello
            pathType: Prefix
            backend:
              service:
                name: hello-service
                port:
                  number: 5000

          - path: /hello-health
            pathType: Prefix
            backend:
              service:
                name: hello-service
                port:
                  number: 5000

          - path: /bye
            pathType: Prefix
            backend:
              service:
                name: bye-service
                port:
                  number: 6000

          - path: /bye-health
            pathType: Prefix
            backend:
              service:
                name: bye-service
                port:
                  number: 6000